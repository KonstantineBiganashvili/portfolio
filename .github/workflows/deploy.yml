name: Test, build, push to GHCR, and update GitOps manifests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (80% coverage gate)
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (fixture content, no CMS needed)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build-push-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: portfolio-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Compute image name + tag
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest

      - name: Pin new digest in argocd-manifests (GitOps)
        env:
          DEPLOY_KEY: ${{ secrets.MANIFESTS_DEPLOY_KEY }}
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.img.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:KonstantineBiganashvili/argocd-manifests.git m
          cd m
          # Replace the pinned digest on the portfolio image line (preserves indentation).
          sed -i -E "s#(image:[[:space:]]+)${IMAGE}@sha256:[a-f0-9]+#\1${IMAGE}@${DIGEST}#" workloads/portfolio/portfolio.yaml
          git config user.name "portfolio-ci"
          git config user.email "ci@biganashvili.dev"
          if git diff --quiet; then
            echo "No image change to commit."; exit 0
          fi
          git add workloads/portfolio/portfolio.yaml
          git commit -m "portfolio: deploy ${TAG} (${DIGEST})"
          git push origin main
