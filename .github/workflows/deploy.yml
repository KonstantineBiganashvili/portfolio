name: Build, Push to GHCR and Deploy to Private Server

on:
  push:
    branches: ['main']

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER}/${REPO}"
          echo "Image: $IMAGE_NAME"
          docker build -t "$IMAGE_NAME:latest" .

      - name: Push image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER}/${REPO}"
          docker push "$IMAGE_NAME:latest"

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          echo "Setting GHCR package visibility to public: $OWNER / $REPO"

          sleep 5

          if ! gh api -X PATCH "/users/$OWNER/packages/container/$REPO" -f visibility=public 2>/dev/null; then
            echo "User endpoint failed, trying organization endpoint..."
            gh api -X PATCH "/orgs/$OWNER/packages/container/$REPO" -f visibility=public || {
              echo "Warning: Could not set package visibility automatically. Please set it manually in GitHub."
              echo "This is not a critical error - continuing workflow."
              exit 0
            }
          fi

          echo "Package visibility set to public successfully!"
